{% extends "base.html" %}

{% block title %}Modifier le produit - MauriMarket{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-pencil-square"></i>
            Modifier le produit
        </h2>

        <a
            href="{% if product.boutique_id %}/ma-boutique{% else %}/mes-annonces{% endif %}"
            class="btn btn-outline-secondary"
        >
            <i class="bi bi-arrow-left"></i>
            Retour
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form
                action="/annonce/modifier/{{ product.id }}"
                method="POST"
                enctype="multipart/form-data"
                id="editProductForm"
            >

                <!-- TITRE -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        Titre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        value="{{ product.title }}"
                        required
                    >
                </div>

                <!-- DESCRIPTION -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="5"
                    >{{ product.description or '' }}</textarea>
                </div>

                <div class="row">

                    <!-- PRIX -->
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">
                            Prix (MRU)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            name="price"
                            value="{{ product.price }}"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                    <!-- VILLE -->
                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label">
                            Ville
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="city"
                            name="city"
                            value="{{ product.city or '' }}"
                        >
                    </div>

                </div>

                <!-- ÉTAT -->
                <div class="mb-3">
                    <label for="condition" class="form-label">
                        État
                    </label>

                    <select
                        class="form-select"
                        id="condition"
                        name="condition"
                    >
                        <option value="">Sélectionner</option>

                        <option
                            value="Neuf"
                            {% if product.condition == "Neuf" %}selected{% endif %}
                        >
                            Neuf
                        </option>

                        <option
                            value="Très bon état"
                            {% if product.condition == "Très bon état" %}selected{% endif %}
                        >
                            Très bon état
                        </option>

                        <option
                            value="Bon état"
                            {% if product.condition == "Bon état" %}selected{% endif %}
                        >
                            Bon état
                        </option>

                        <option
                            value="État moyen"
                            {% if product.condition == "État moyen" %}selected{% endif %}
                        >
                            État moyen
                        </option>

                        <option
                            value="À réparer"
                            {% if product.condition == "À réparer" %}selected{% endif %}
                        >
                            À réparer
                        </option>
                    </select>
                </div>

                <!-- CATÉGORIE -->
                <div class="mb-3">
                    <label for="category_id" class="form-label">
                        Catégorie
                    </label>

                    <select
                        class="form-select"
                        id="category_id"
                        name="category_id"
                    >
                        <option value="">Sélectionner une catégorie</option>

                        {% for category in categories %}
                        <option
                            value="{{ category.id }}"
                            {% if product.category_id == category.id %}selected{% endif %}
                        >
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- SOUS-CATÉGORIE -->
                <div class="mb-3">
                    <label for="subcategory_id" class="form-label">
                        Sous-catégorie
                    </label>

                    <select
                        class="form-select"
                        id="subcategory_id"
                        name="subcategory_id"
                    >
                        <option value="">Aucune sous-catégorie</option>

                        {% for subcategory in subcategories %}
                        <option
                            value="{{ subcategory.id }}"
                            data-category-id="{{ subcategory.category_id }}"
                            {% if product.subcategory_id == subcategory.id %}selected{% endif %}
                        >
                            {{ subcategory.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- LIVRAISON -->
                <div class="form-check mb-4">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="delivery_available"
                        name="delivery_available"
                        value="1"
                        {% if product.delivery_available %}checked{% endif %}
                    >

                    <label
                        class="form-check-label"
                        for="delivery_available"
                    >
                        Livraison disponible
                    </label>
                </div>

                <!-- IMAGE ACTUELLE -->
                {% if product.image %}
                <div class="mb-4">
                    <label class="form-label">
                        Image actuelle
                    </label>

                    <div>
                        <img
                            src="{{ product.image }}"
                            alt="{{ product.title }}"
                            class="img-fluid rounded"
                            style="max-width: 300px; max-height: 250px; object-fit: contain;"
                            onerror="this.style.display='none';"
                        >
                    </div>
                </div>
                {% endif %}

                <!-- NOUVELLE IMAGE -->
                <div class="mb-4">
                    <label for="image" class="form-label">
                        Nouvelle image
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="image"
                        name="image"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <div class="form-text">
                        Laissez vide pour conserver l'image actuelle.
                    </div>

                    <div class="mt-3">
                        <img
                            id="imagePreview"
                            src=""
                            alt="Aperçu"
                            class="img-fluid rounded d-none"
                            style="max-width: 300px; max-height: 250px; object-fit: contain;"
                        >
                    </div>
                </div>

                <!-- BOUTONS -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-lg"></i>
                        Enregistrer les modifications
                    </button>

                    <a
                        href="{% if product.boutique_id %}/ma-boutique{% else %}/mes-annonces{% endif %}"
                        class="btn btn-outline-secondary"
                    >
                        Annuler
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const categorySelect = document.getElementById("category_id");
    const subcategorySelect = document.getElementById("subcategory_id");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");

    function filterSubcategories() {

        const categoryId = categorySelect.value;

        Array.from(subcategorySelect.options).forEach(function (option) {

            if (!option.value) {
                option.style.display = "";
                return;
            }

            const optionCategoryId = option.dataset.categoryId;

            if (optionCategoryId === categoryId) {
                option.style.display = "";
            } else {
                option.style.display = "none";

                if (option.selected) {
                    option.selected = false;
                }
            }
        });
    }

    categorySelect.addEventListener("change", filterSubcategories);

    filterSubcategories();

    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            imagePreview.src = "";
            imagePreview.classList.add("d-none");
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
            imagePreview.src = event.target.result;
            imagePreview.classList.remove("d-none");
        };

        reader.readAsDataURL(file);
    });

});
</script>

{% endblock %}
