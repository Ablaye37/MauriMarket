{% extends "base.html" %}

{% block title %}
Publier un produit - MauriMarket
{% endblock %}

{% block content %}

<div class="container mt-4 mb-5">

    <!-- =========================
         EN-TÊTE
    ========================== -->

    <div class="mb-4">

        <h2 class="fw-bold">
            <i class="bi bi-plus-circle"></i>
            Publier un produit
        </h2>

        {% if boutique %}

        <p class="text-muted mb-0">
            Votre produit sera publié dans :
            <strong>{{ boutique.name }}</strong>
        </p>

        {% endif %}

    </div>


    <!-- =========================
         FORMULAIRE
    ========================== -->

    <form
        action="/publier"
        method="post"
        enctype="multipart/form-data"
    >

        <!-- =========================
             PHOTO
        ========================== -->

        <div class="mb-3">

            <label
                for="image"
                class="form-label fw-semibold"
            >
                Photo du produit
            </label>

            <input
                type="file"
                name="image"
                id="image"
                class="form-control"
                accept="image/*"
            >

        </div>


        <!-- =========================
             NOM
        ========================== -->

        <div class="mb-3">

            <label
                for="title"
                class="form-label fw-semibold"
            >
                Nom du produit
            </label>

            <input
                type="text"
                name="title"
                id="title"
                class="form-control"
                placeholder="Ex : iPhone 15 Pro"
                required
            >

        </div>


        <!-- =========================
             DESCRIPTION
        ========================== -->

        <div class="mb-3">

            <label
                for="description"
                class="form-label fw-semibold"
            >
                Description
            </label>

            <textarea
                name="description"
                id="description"
                class="form-control"
                rows="4"
                placeholder="Décrivez votre produit..."
                required
            ></textarea>

        </div>


        <!-- =========================
             PRIX
        ========================== -->

        <div class="mb-3">

            <label
                for="price"
                class="form-label fw-semibold"
            >
                Prix
            </label>

            <input
                type="number"
                name="price"
                id="price"
                class="form-control"
                min="0"
                step="0.01"
                placeholder="Ex : 25000"
                required
            >

        </div>


        <!-- =========================
             VILLE
        ========================== -->

        <div class="mb-3">

            <label
                for="city"
                class="form-label fw-semibold"
            >
                Ville
            </label>

            <input
                type="text"
                name="city"
                id="city"
                class="form-control"
                placeholder="Ex : Nouakchott"
                required
            >

        </div>


        <!-- =========================
             ÉTAT
        ========================== -->

        <div class="mb-3">

            <label
                for="condition"
                class="form-label fw-semibold"
            >
                État du produit
            </label>

            <select
                name="condition"
                id="condition"
                class="form-select"
                required
            >

                <option value="">
                    -- Choisir l'état --
                </option>

                <option value="Neuf">
                    Neuf
                </option>

                <option value="Très bon état">
                    Très bon état
                </option>

                <option value="Bon état">
                    Bon état
                </option>

                <option value="Occasion">
                    Occasion
                </option>

            </select>

        </div>


        <!-- =========================
             TYPE DE PUBLICATION
        ========================== -->

        <div class="mb-3">

            <label
                for="publication_type"
                class="form-label fw-semibold"
            >
                Type de publication
            </label>

            <select
                name="publication_type"
                id="publication_type"
                class="form-select"
                required
            >

                <option value="">
                    -- Choisir le type --
                </option>

                <option value="vente">
                    Vente
                </option>

                <option value="annonce">
                    Annonce
                </option>

            </select>

        </div>


        <!-- =========================
             CATÉGORIE
        ========================== -->

        <div class="mb-3">

            <label
                for="category_id"
                class="form-label fw-semibold"
            >
                Catégorie
            </label>

            <select
                name="category_id"
                id="category_id"
                class="form-select"
                required
            >

                <option value="">
                    -- Choisir une catégorie --
                </option>

                {% for category in categories %}

                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- =========================
             SOUS-CATÉGORIE
        ========================== -->

        <div class="mb-4">

            <label
                for="subcategory_id"
                class="form-label fw-semibold"
            >
                Sous-catégorie
            </label>

            <select
                name="subcategory_id"
                id="subcategory_id"
                class="form-select"
                required
            >

                <option value="">
                    -- Choisir une sous-catégorie --
                </option>

                {% for subcategory in subcategories %}

                <option
                    value="{{ subcategory.id }}"
                    data-category="{{ subcategory.category_id }}"
                >
                    {{ subcategory.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- =========================
             BOUTON
        ========================== -->

        <button
            type="submit"
            class="btn btn-success"
        >

            <i class="bi bi-check-circle"></i>

            Publier le produit

        </button>

    </form>

</div>


<!-- =========================
     FILTRE DES SOUS-CATÉGORIES
========================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const categorySelect =
            document.getElementById("category_id");

        const subcategorySelect =
            document.getElementById("subcategory_id");


        if (
            !categorySelect ||
            !subcategorySelect
        ) {
            return;
        }


        const options =
            Array.from(
                subcategorySelect.options
            );


        function filtrerSousCategories() {

            const categoryId =
                categorySelect.value;


            subcategorySelect.value = "";


            options.forEach(
                function (option) {

                    if (!option.value) {

                        option.hidden = false;

                        return;

                    }


                    if (
                        option.dataset.category ===
                        categoryId
                    ) {

                        option.hidden = false;

                    } else {

                        option.hidden = true;

                    }

                }
            );

        }


        categorySelect.addEventListener(
            "change",
            filtrerSousCategories
        );


        filtrerSousCategories();

    }
);

</script>

{% endblock %}
