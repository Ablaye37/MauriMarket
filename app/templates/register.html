{% extends "base.html" %}

{% block title %}
Inscription - MauriMarket
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Créer un compte
                </h2>


                <form method="POST" action="/register">


                    <div class="mb-3">
                        <label class="form-label">
                            Nom complet
                        </label>

                        <input 
                        type="text"
                        name="full_name"
                        class="form-control"
                        required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Téléphone
                        </label>

                        <input 
                        type="text"
                        name="phone"
                        class="form-control"
                        required>
                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Mot de passe
                        </label>

                        <input 
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                    </div>


                    <button class="btn btn-success w-100">
                        S'inscrire
                    </button>


                </form>

            </div>

        </div>

    </div>

</div>


{% endblock %}
