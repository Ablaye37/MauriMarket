{% extends "base.html" %}

{% block title %}
{% if lang == "ar" %}
إنشاء حساب - MauriMarket
{% else %}
Inscription - MauriMarket
{% endif %}
{% endblock %}

{% block content %}

<div class="container py-5">


<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                {% if lang == "ar" %}
                    إنشاء حساب
                {% else %}
                    Créer un compte
                {% endif %}
            </h2>




            <form method="post" action="/register{% if lang == 'ar' %}?lang=ar{% else %}?lang=fr{% endif %}">


                <div class="mb-3">

                    <label class="form-label">
                        {% if lang == "ar" %}
                            الاسم الكامل
                        {% else %}
                            Nom complet
                        {% endif %}
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        required
                        {% if lang == "ar" %}
                            placeholder="أدخل اسمك الكامل"
                        {% else %}
                            placeholder="Entrez votre nom complet"
                        {% endif %}
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        {% if lang == "ar" %}
                            رقم الهاتف
                        {% else %}
                            Téléphone
                        {% endif %}
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        required
                        {% if lang == "ar" %}
                            placeholder="أدخل رقم هاتفك"
                        {% else %}
                            placeholder="Entrez votre numéro de téléphone"
                        {% endif %}
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        {% if lang == "ar" %}
                            كلمة المرور
                        {% else %}
                            Mot de passe
                        {% endif %}
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                        {% if lang == "ar" %}
                            placeholder="أدخل كلمة المرور"
                        {% else %}
                            placeholder="Entrez votre mot de passe"
                        {% endif %}
                    >

                </div>


                <button class="btn btn-success w-100">

                    {% if lang == "ar" %}
                        إنشاء الحساب
                    {% else %}
                        S'inscrire
                    {% endif %}

                </button>


            </form>

        </div>

    </div>

</div>


</div>

{% endblock %}
